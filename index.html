      const { useState, useEffect, useRef, useCallback } = React;

      const ICON_ALIASES = { PlusSquare: 'SquarePlus', Edit3: 'Pencil' };

      // --- Format & Helpers ---
      const uid = (p = 'id') => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
      function formatTime(sec) {
        if (!Number.isFinite(sec) || sec < 0) return '0:00';
        const t = Math.floor(sec), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
        return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;

      }
      function formatDateTime(ts) {

      }
      function detectRestrictedPlatform(url) {
        const l = (url || '').toLowerCase().trim();
        if (!l) return null;
        if (l.includes('youtube.com') || l.includes('youtu.be')) return 'youtube';
        if (l.includes('twitch.tv')) return 'twitch';
        if (l.includes('kick.com')) return 'kick';
        return null;
      }

      // --- Provider Defaults ---
      function getDefaultModel(p) {
        return { gemini: 'gemini-2.5-flash', openai: 'gpt-4o-mini', grok: 'grok-3-mini', groq: 'llama-3.3-70b-versatile', openrouter: 'google/gemini-2.5-flash', claude: 'claude-3-5-haiku-latest', ollama: 'llama3.2', custom: 'gpt-4o-mini' }[p] || 'gemini-2.5-flash';
      }
      function getDefaultBaseUrl(p) {
        return { openai: 'https://api.openai.com/v1', grok: 'https://api.x.ai/v1', groq: 'https://api.groq.com/openai/v1', openrouter: 'https://openrouter.ai/api/v1', claude: 'https://api.anthropic.com/v1', ollama: 'http://localhost:11434/v1', custom: 'http://localhost:8000/v1', gemini: '' }[p] || '';
      }

      // --- IndexedDB + localStorage Storage ---
      const DB_NAME = 'peakcut_studio_db', STORES = { BLOBS: 'media_blobs', WORKSPACES: 'workspaces', JOBS: 'jobs', CLIPS: 'clips', POSTS: 'posts', AI_USAGE: 'ai_usage' };
      const LS_WS = 'peakcut_active_workspace_id', LS_ONBOARD = 'peakcut_onboarding_done', LS_AI = 'peakcut_ai_settings_v1', LS_VAULT = 'peakcut_ai_cred_vault_v1';

      function createDefaultWorkspace(name = 'Creator Studio') {
        return {
          id: uid('ws'), name, avatarDataUrl: '', avatarColor: '#f59e0b',
          channels: { youtube: '', twitch: '', kick: '', instagram: '' },
          clipDefaults: { minDurationSec: 20, maxDurationSec: 45, clipCount: 4, captionStyle: 'bold-pop', cropMode: 'center-crop', hookEnabled: true, language: 'auto' },
          postingRules: { minSpacingHours: 6, dailyCap: 3 },
          activityLog: [{ id: uid('log'), timestamp: Date.now(), type: 'workspace', message: `Workspace "${name}" created` }],
          createdAt: Date.now(),
        };
      }
      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORES.BLOBS)) db.createObjectStore(STORES.BLOBS);
            [STORES.WORKSPACES, STORES.JOBS, STORES.CLIPS, STORES.POSTS, STORES.AI_USAGE].forEach((s) => {
              if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
            });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error || new Error('IndexedDB failed'));
        });
      }
      async function idbAll(s) { const db = await openDB(); return new Promise((res, rej) => { const r = db.transaction(s, 'readonly').objectStore(s).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); }
      async function idbGet(s, k) { const db = await openDB(); return new Promise((res, rej) => { const r = db.transaction(s, 'readonly').objectStore(s).get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
      async function idbPut(s, v, k) { const db = await openDB(); return new Promise((res, rej) => { const st = db.transaction(s, 'readwrite').objectStore(s); const r = k !== undefined ? st.put(v, k) : st.put(v); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
      async function idbDel(s, k) { const db = await openDB(); return new Promise((res, rej) => { const r = db.transaction(s, 'readwrite').objectStore(s).delete(k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }

      const storage = {
        saveBlob: (k, b) => idbPut(STORES.BLOBS, b, k),
        getBlob: (k) => idbGet(STORES.BLOBS, k),
        deleteBlob: (k) => idbDel(STORES.BLOBS, k),
        getWorkspaces: async () => (await idbAll(STORES.WORKSPACES)).sort((a, b) => a.createdAt - b.createdAt),
        saveWorkspace: (w) => idbPut(STORES.WORKSPACES, w),
        deleteWorkspace: (id) => idbDel(STORES.WORKSPACES, id),
        async appendActivity(wsId, entry) {
          const ws = await idbGet(STORES.WORKSPACES, wsId);
          if (!ws) return;
          const next = { ...ws, activityLog: [{ id: uid('log'), timestamp: Date.now(), ...entry }, ...(ws.activityLog || [])].slice(0, 150) };
          await idbPut(STORES.WORKSPACES, next);
          return next;
        },
        getJobs: async () => (await idbAll(STORES.JOBS)).sort((a, b) => b.createdAt - a.createdAt),
        saveJob: (j) => idbPut(STORES.JOBS, j),
        deleteJob: (id) => idbDel(STORES.JOBS, id),
        getClips: async () => (await idbAll(STORES.CLIPS)).sort((a, b) => b.createdAt - a.createdAt),
        saveClip: (c) => idbPut(STORES.CLIPS, c),
        async deleteClip(id) {
          const c = await idbGet(STORES.CLIPS, id);
          if (c?.renderedBlobKey) await idbDel(STORES.BLOBS, c.renderedBlobKey).catch(() => {});
          await idbDel(STORES.CLIPS, id);
        },
        getPosts: async () => (await idbAll(STORES.POSTS)).sort((a, b) => (a.scheduledAt || a.createdAt) - (b.scheduledAt || b.createdAt)),
        savePost: (p) => idbPut(STORES.POSTS, p),
        deletePost: (id) => idbDel(STORES.POSTS, id),
        getAIUsage: async () => (await idbAll(STORES.AI_USAGE)).sort((a, b) => b.timestamp - a.timestamp),
        addAIUsage: (r) => idbPut(STORES.AI_USAGE, r),
        getActiveWorkspaceId: () => localStorage.getItem(LS_WS),
        setActiveWorkspaceId: (id) => localStorage.setItem(LS_WS, id),
        isOnboardingDone: () => localStorage.getItem(LS_ONBOARD) === '1',
        setOnboardingDone: () => localStorage.setItem(LS_ONBOARD, '1'),
        hasSavedProviderKey(p) { try { return Boolean(JSON.parse(localStorage.getItem(LS_VAULT) || '{}')[p]?.trim()); } catch { return false; } },
        getProviderKeyInternal(p) { try { return JSON.parse(localStorage.getItem(LS_VAULT) || '{}')[p] || undefined; } catch { return undefined; } },
        getAISettings() {
          try {
            const p = JSON.parse(localStorage.getItem(LS_AI) || 'null');
            if (p) {
              const prov = p.provider || 'gemini';
              return { provider: prov, hasSavedKey: this.hasSavedProviderKey(prov), models: p.models || getDefaultModel(prov), baseUrl: p.baseUrl || getDefaultBaseUrl(prov) };
            }
          } catch {}
          return { provider: 'gemini', hasSavedKey: this.hasSavedProviderKey('gemini'), models: 'gemini-2.5-flash', baseUrl: '' };
        },
        saveAISettings(s, newKey, clearKey) {
          try {
            const vault = JSON.parse(localStorage.getItem(LS_VAULT) || '{}');
            if (clearKey) delete vault[s.provider];
            else if (newKey && newKey.trim()) vault[s.provider] = newKey.trim();
            localStorage.setItem(LS_VAULT, JSON.stringify(vault));
          } catch {}
          localStorage.setItem(LS_AI, JSON.stringify(s));
          return { ...s, hasSavedKey: this.hasSavedProviderKey(s.provider) };
        },
        async exportBackup() {
          const [workspaces, jobs, clips, posts, aiUsage] = await Promise.all([this.getWorkspaces(), this.getJobs(), this.getClips(), this.getPosts(), this.getAIUsage()]);
          const ai = this.getAISettings();
          return { version: 1, exportedAt: Date.now(), workspaces, jobs, clips, posts, aiUsage, aiProviderSettings: { provider: ai.provider, models: ai.models, baseUrl: ai.baseUrl } };
        },
        async importBackup(payload) {
          if (!payload || !Array.isArray(payload.workspaces)) throw new Error('Invalid backup JSON file');
          for (const x of payload.workspaces) await idbPut(STORES.WORKSPACES, x);
          for (const x of payload.jobs || []) await idbPut(STORES.JOBS, x);
          for (const x of payload.clips || []) await idbPut(STORES.CLIPS, x);
          for (const x of payload.posts || []) await idbPut(STORES.POSTS, x);
          for (const x of payload.aiUsage || []) await idbPut(STORES.AI_USAGE, x);
          if (payload.aiProviderSettings) this.saveAISettings(payload.aiProviderSettings);
          if (payload.workspaces[0]) this.setActiveWorkspaceId(payload.workspaces[0].id);
        },
        async clearAllData() {
          const db = await openDB();
          await Promise.all(Object.values(STORES).map((n) => new Promise((res, rej) => { const r = db.transaction(n, 'readwrite').objectStore(n).clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); })));
          [LS_WS, LS_AI, LS_VAULT].forEach((k) => localStorage.removeItem(k));
        },
      };

      // --- Web Audio Extraction, 16kHz Mono Chunking & RMS Peak Fallback ---
      const SAMPLE_RATE = 16000, CHUNK_SEC = 600;
      function encodeWav(samples, sr) {
        const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
        const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
        ws(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true);
        v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
        ws(36, 'data'); v.setUint32(40, samples.length * 2, true);
        let off = 44;
        for (let i = 0; i < samples.length; i++) {
          const s = Math.max(-1, Math.min(1, samples[i]));
          v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
          off += 2;
        }
        return buf;
      }
      function abToBase64(buf) {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
        return btoa(bin);
      }
      function computeRms(samples, sr) {
        const secs = Math.max(1, Math.ceil(samples.length / sr)), out = [];
        for (let s = 0; s < secs; s++) {
          const a = s * sr, b = Math.min(samples.length, a + sr);
          let sum = 0;
          for (let i = a; i < b; i++) sum += samples[i] * samples[i];
          out.push(Math.sqrt(sum / Math.max(1, b - a)));
        }
        return out;
      }
      function getVideoDurationFromBlob(blob) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(blob), v = document.createElement('video');
          v.preload = 'metadata'; v.muted = true; v.playsInline = true;
          const clean = () => { URL.revokeObjectURL(url); v.removeAttribute('src'); v.load(); };
          v.onloadedmetadata = () => { const d = Number.isFinite(v.duration) && v.duration > 0 ? v.duration : 0; clean(); resolve(d); };
          v.onerror = () => { clean(); reject(new Error('Unsupported video format. Try MP4 (H.264/AAC) or WebM.')); };
          v.src = url;
        });
      }
      async function decodeResample16k(blob) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) throw new Error('Web Audio API is not supported in this browser.');
        const buf = await blob.arrayBuffer().catch(() => { throw new Error('Could not read file into memory. Try a shorter video.'); });
        const ctx = new AC();
        let decoded;
        try { decoded = await ctx.decodeAudioData(buf); } catch { await ctx.close().catch(() => {}); throw new Error('Could not decode audio track from this file.'); }
        const offline = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * SAMPLE_RATE)), SAMPLE_RATE);
        const src = offline.createBufferSource(); src.buffer = decoded; src.connect(offline.destination); src.start(0);
        const rendered = await offline.startRendering();
        await ctx.close().catch(() => {});
        return { durationSec: decoded.duration, samples: rendered.getChannelData(0) };
      }
      async function extractAudioAndChunk(blob, onProgress) {
        onProgress?.(15, 'Decoding audio track...');
        const { durationSec, samples } = await decodeResample16k(blob);
        onProgress?.(65, 'Analyzing RMS loudness profile...');
        const perSecondRms = computeRms(samples, SAMPLE_RATE);
        onProgress?.(85, 'Splitting into 10-minute 16 kHz mono chunks...');
        const step = CHUNK_SEC * SAMPLE_RATE, chunks = [];
        for (let i = 0, idx = 0; i < samples.length; i += step, idx++) {
          const slice = samples.subarray(i, Math.min(samples.length, i + step));
          const wav = encodeWav(slice, SAMPLE_RATE);
          chunks.push({ index: idx, startSec: i / SAMPLE_RATE, endSec: Math.min(samples.length, i + step) / SAMPLE_RATE, wavBase64: abToBase64(wav), wavBlob: new Blob([wav], { type: 'audio/wav' }) });
        }
        onProgress?.(100, `Extracted ${chunks.length} chunk${chunks.length === 1 ? '' : 's'} at 16 kHz mono`);
        return { durationSec, chunks, perSecondRms };
      }
      async function blobToMono16kWav(blob) {
        const { durationSec, samples } = await decodeResample16k(blob);
        const wav = encodeWav(samples, SAMPLE_RATE);
        return { wavBase64: abToBase64(wav), wavBlob: new Blob([wav], { type: 'audio/wav' }), durationSec };
      }
      function selectClipsByLoudnessPeaks(rms, durationSec, opts) {
        const total = Math.max(1, Math.floor(durationSec));
        const len = Math.min(total, Math.max(15, Math.round((opts.minDurationSec + opts.maxDurationSec) / 2)));
        if (total <= opts.minDurationSec) {
          return [{ start: 0, end: Number(durationSec.toFixed(1)), score: 7, title: 'Full Highlight Clip', hook: 'Watch this moment', reason: 'Selected from peak audio energy (no AI key configured)' }];
        }
        const cands = [], step = Math.max(2, Math.floor(len / 4)), maxR = Math.max(0.0001, ...rms);
        for (let st = 0; st + opts.minDurationSec <= total; st += step) {
          const en = Math.min(total, st + len);
          let sum = 0, pk = 0;
          for (let s = st; s < en; s++) { const v = rms[s] || 0; sum += v; if (v > pk) pk = v; }
          cands.push({ start: st, end: en, energy: ((sum / Math.max(1, en - st)) * 0.55 + pk * 0.45) / maxR });
        }
        cands.sort((a, b) => b.energy - a.energy);
        const picked = [];
        for (const c of cands) {
          if (picked.length >= opts.clipCount) break;
          if (!picked.some((p) => Math.max(p.start, c.start) < Math.min(p.end, c.end) - 3)) picked.push(c);
        }
        picked.sort((a, b) => a.start - b.start);
        return picked.map((p, i) => ({
          start: p.start, end: p.end, score: Math.min(10, Math.max(5, Math.round(5 + p.energy * 5))),
          title: `Peak Energy Clip ${i + 1}`, hook: `High-energy moment #${i + 1}`,
          reason: 'Auto-detected from audio loudness peaks (add an AI key for smart hooks & captions)',
        }));
      }

      // --- Direct Browser AI Clients ---
      function parseJsonRobust(raw) {
        const cleaned = (raw || '').trim().replace(/^```(?:json)?\s*([\s\S]*?)```$/i, '$1').trim();
        try { return JSON.parse(cleaned); } catch {
          const o = cleaned.indexOf('{'), a = cleaned.indexOf('[');
          const s = a !== -1 && (o === -1 || a < o) ? a : o;
          const e = s === a ? cleaned.lastIndexOf(']') : cleaned.lastIndexOf('}');
          if (s !== -1 && e > s) return JSON.parse(cleaned.slice(s, e + 1));
          throw new Error('Model returned invalid JSON');
        }
      }
      const parseModels = (s) => (s || '').split(',').map((m) => m.trim()).filter(Boolean);
      const effBaseUrl = (s) => (s.baseUrl || getDefaultBaseUrl(s.provider)).trim().replace(/\/+$/, '');
      const isAIReady = (s) => s.provider === 'ollama' ? Boolean(effBaseUrl(s)) : Boolean(storage.getProviderKeyInternal(s.provider));

      async function directJsonFetch(url, opts) {
        let res;
        try { res = await fetch(url, opts); } catch { throw new Error(`Network/CORS error calling ${url}. Ensure provider allows browser requests.`); }
        const text = await res.text();
        if (!res.ok) {
          let msg = text;
          try { const j = JSON.parse(text); msg = typeof j.error === 'string' ? j.error : j.error?.message || j.message || text; } catch {}
          throw new Error(`Provider error (${res.status}): ${String(msg).slice(0, 240)}`);
        }
        return JSON.parse(text);
      }

      async function withModelFallback(models, fn) {
        let lastErr;
        for (const m of models) {
          try { return { result: await fn(m), modelUsed: m }; } catch (e) {
            lastErr = e;
            const msg = e instanceof Error ? e.message : String(e);
            if (msg.includes('API_KEY_INVALID') || msg.includes('401') || msg.includes('403')) throw e;
          }
        }
        throw lastErr || new Error('All configured models failed');
      }

      function geminiSchema(type) {
        if (type === 'moments') return { type: 'OBJECT', properties: { moments: { type: 'ARRAY', items: { type: 'OBJECT', properties: { start: { type: 'NUMBER' }, end: { type: 'NUMBER' }, title: { type: 'STRING' }, hook: { type: 'STRING' }, score: { type: 'NUMBER' }, reason: { type: 'STRING' } }, required: ['start', 'end', 'title', 'hook', 'score', 'reason'] } } }, required: ['moments'] };

          video.currentTime = startSec;
          await new Promise((res) => { const f = () => { video.removeEventListener('seeked', f); res(); }; video.addEventListener('seeked', f); });
          const mimes = [{ m: 'video/mp4;codecs=avc1,mp4a.40.2', e: 'mp4' }, { m: 'video/mp4', e: 'mp4' }, { m: 'video/webm;codecs=vp9,opus', e: 'webm' }, { m: 'video/webm;codecs=vp8,opus', e: 'webm' }, { m: 'video/webm', e: 'webm' }];
          const chosen = mimes.find((x) => typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(x.m)) || { m: 'video/webm', e: 'webm' };
          const stream = new MediaStream([...canvas.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
          const rec = new MediaRecorder(stream, { mimeType: chosen.m, videoBitsPerSecond: 6_000_000 });
          const chunks = [];
          rec.ondataavailable = (e) => { if (e.data?.size) chunks.push(e.data); };
          if (audioCtx.state === 'suspended') await audioCtx.resume();
          const dur = Math.max(1, endSec - startSec);

          const blob = await new Promise((res, rej) => {
            let raf = 0, done = false;
            const stop = () => { if (!done) { done = true; cancelAnimationFrame(raf); if (rec.state !== 'inactive') rec.stop(); } };
            rec.onstop = () => res(new Blob(chunks, { type: chosen.m }));
            rec.onerror = () => { done = true; cancelAnimationFrame(raf); rej(new Error('MediaRecorder encoding failed')); };
            signal?.addEventListener('abort', () => { done = true; cancelAnimationFrame(raf); if (rec.state !== 'inactive') rec.stop(); rej(new Error('Render cancelled')); }, { once: true });
            const loop = () => {
              if (done) return;
              const t = video.currentTime;
              drawClipFrame({ ctx, width: 1080, height: 1920, video, currentTimeSec: t, clipStartSec: startSec, clipEndSec: endSec, cropMode, hook, hookEnabled, captionStyle, words });
              onProgress?.(Math.min(99, Math.max(3, Math.round(((t - startSec) / dur) * 96) + 3)), `Rendering 9:16 (${Math.round(t - startSec)}s / ${Math.round(dur)}s)`);
              if (t >= endSec || video.ended) { stop(); return; }
              raf = requestAnimationFrame(loop);
            };
            rec.start(250);
            video.play().then(() => { raf = requestAnimationFrame(loop); }).catch((err) => { done = true; rej(err); });
          });
          onProgress?.(100, 'Render complete');
          return { blob, mimeType: chosen.m, extension: chosen.e };
        } finally { cleanup(); }
      }

      // --- Job Queue Execution ---
      const activeJobs = new Map();
      function cancelJobExecution(id) { activeJobs.get(id)?.abort(); activeJobs.delete(id); }

      async function processClipJob(initialJob, cb) {
        const ctrl = new AbortController(); activeJobs.set(initialJob.id, ctrl);
        let job = { ...initialJob };
        const upd = async (p) => { job = { ...job, ...p, updatedAt: Date.now() }; await storage.saveJob(job); cb.onJobUpdated(job); };
        const checkAbort = () => { if (ctrl.signal.aborted) throw new Error('JOB_CANCELLED'); };

        try {
          await storage.appendActivity(job.workspaceId, { type: 'job_started', message: `Started clip job "${job.title}"` });
          cb.onActivityLogged(job.workspaceId);
          await upd({ stage: 'extracting', progress: 5, stageDetail: job.sourceType === 'url' ? 'Downloading direct video URL...' : 'Loading video file...', error: undefined });

          let blob = job.videoBlobKey ? await storage.getBlob(job.videoBlobKey) : null;
          let videoBlobKey = job.videoBlobKey;
          if (!blob && job.sourceType === 'url' && job.sourceUrl) {
            const res = await fetch(job.sourceUrl, { signal: ctrl.signal });
            if (!res.ok) throw new Error(`Could not fetch URL (${res.status}). Ensure host allows direct CORS downloads.`);
            blob = await res.blob(); videoBlobKey = uid('vid'); await storage.saveBlob(videoBlobKey, blob);
            await upd({ videoBlobKey, fileSizeBytes: blob.size });
          }
          if (!blob) throw new Error('Video source missing from browser storage.');
          checkAbort();

          const dur = job.durationSec > 0 ? job.durationSec : await getVideoDurationFromBlob(blob);
          await upd({ durationSec: dur });
          const audio = await extractAudioAndChunk(blob, (p, d) => upd({ stage: 'extracting', progress: Math.round(5 + p * 0.25), stageDetail: d }).catch(() => {}));
          checkAbort();

          const aiSettings = storage.getAISettings(), aiOk = isAIReady(aiSettings);
          let words = [], txt = '', fallback = !aiOk, moments = [];
          if (aiOk) {
            await upd({ stage: 'transcribing', progress: 35, stageDetail: `Transcribing ${audio.chunks.length} chunk${audio.chunks.length === 1 ? '' : 's'}...` });
            const texts = [];
            for (let i = 0; i < audio.chunks.length; i++) {
              checkAbort();
              await upd({ stage: 'transcribing', progress: Math.round(35 + (i / audio.chunks.length) * 35), stageDetail: `Transcribing chunk ${i + 1} of ${audio.chunks.length}...` });
              try {
                const tr = await transcribeAudioChunk({ chunk: audio.chunks[i], settings: aiSettings, language: job.settings.language, workspaceId: job.workspaceId, jobId: job.id, jobTitle: job.title });
                if (tr.text) texts.push(tr.text);
                words = words.concat(tr.words);
              } catch (err) {
                if (i === 0 && !words.length && String(err.message).includes('does not support audio transcription')) { fallback = true; break; }
                throw err;
              }
            }
            txt = texts.join(' ').trim();
          }
          checkAbort();

          if (!fallback && words.length > 0) {
            await upd({ stage: 'finding-moments', progress: 78, stageDetail: 'Finding best viral moments...', transcriptText: txt, words });
            moments = await findViralMoments({ words, durationSec: audio.durationSec, settings: aiSettings, clipConfig: job.settings, workspaceId: job.workspaceId, jobId: job.id, jobTitle: job.title });
          }
          if (!moments.length) {
            fallback = true;
            await upd({ stage: 'finding-moments', progress: 84, stageDetail: 'Selecting clips by audio loudness peaks (RMS)...' });
            moments = selectClipsByLoudnessPeaks(audio.perSecondRms, audio.durationSec, job.settings);
          }
          checkAbort();

          const clips = moments.map((m) => {
            const cw = words.filter((w) => w.end >= m.start && w.start <= m.end);
            return {
              id: uid('clip'), jobId: job.id, workspaceId: job.workspaceId, sourceVideoBlobKey: videoBlobKey,
              title: m.title, hook: m.hook, hookEnabled: job.settings.hookEnabled, score: m.score, scoreReason: m.reason,
              startSec: m.start, endSec: m.end, sourceDurationSec: audio.durationSec,
              captionStyle: job.settings.captionStyle, cropMode: job.settings.cropMode, words: cw, hasCaptions: cw.length > 0,
              createdAt: Date.now(), updatedAt: Date.now(),
            };
          });
          for (const c of clips) await storage.saveClip(c);
          await upd({
            stage: 'ready', progress: 100, usedFallbackMode: fallback, clipIds: clips.map((c) => c.id),
            stageDetail: fallback ? `Ready (${clips.length} clips via loudness peaks — add AI key for captions)` : `Ready (${clips.length} captioned clips generated)`,
          });
          await storage.appendActivity(job.workspaceId, { type: 'clips_created', message: `Created ${clips.length} clips from "${job.title}"` });
          cb.onClipsCreated(clips); cb.onActivityLogged(job.workspaceId);
        } catch (err) {
          if (err?.message === 'JOB_CANCELLED') await upd({ stage: 'cancelled', stageDetail: 'Cancelled by user' });
          else {
            const msg = err instanceof Error ? err.message : 'Processing failed';
            await upd({ stage: 'failed', stageDetail: 'Processing failed', error: msg });
            await storage.appendActivity(job.workspaceId, { type: 'error', message: `Job "${job.title}" failed: ${msg}` });
            cb.onActivityLogged(job.workspaceId);
          }
        } finally { activeJobs.delete(initialJob.id); }
      }

                <Icon name="Volume2" className="w-4 h-4 text-amber-400 shrink-0 mt-0.5" />
                <span><strong>No AI key set:</strong> PeakCut still finds clips via audio loudness peaks (RMS). Add an AI key in Settings &gt; AI for captions.</span>
              </div>
            )}

            <div
              onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
              onDragLeave={() => setDrag(false)}
              onDrop={(e) => { e.preventDefault(); setDrag(false); pickFile(e.dataTransfer.files?.[0]); }}
              className={`rounded-2xl border-2 border-dashed p-6 sm:p-8 text-center transition-colors ${drag ? 'border-amber-500 bg-amber-500/10' : file ? 'border-emerald-500/50 bg-emerald-500/5' : 'border-zinc-800 bg-[#111114]'}`}
            >
              <input ref={fileRef} type="file" accept="video/*,audio/*" className="hidden" onChange={(e) => pickFile(e.target.files?.[0])} />
              {file ? (
                <div className="space-y-3">
                  <Icon name="Film" className="w-10 h-10 text-emerald-400 mx-auto" />
                  <p className="text-base font-semibold text-zinc-100 break-all">{file.name}</p>
                  <p className="text-xs text-zinc-400 font-mono-tabular">{formatBytes(file.size)} · {file.type || 'video'}</p>
                  <div className="flex justify-center gap-3">
                    <button type="button" onClick={() => fileRef.current?.click()} className="min-h-[44px] rounded-xl border border-zinc-700 bg-zinc-900 px-4 text-xs font-medium text-zinc-200">Choose different file</button>
                    <button type="button" onClick={() => setFile(null)} className="min-h-[44px] rounded-xl px-4 text-xs text-zinc-400 hover:text-zinc-200">Clear</button>
                  </div>
                </div>
              ) : (
                <div className="space-y-3">
                  <Icon name="Upload" className="w-9 h-9 text-amber-400 mx-auto" />
                  <p className="text-base font-semibold text-zinc-100">Drop your video here or tap to browse</p>
                  <p className="text-xs text-zinc-400">Supports MP4, WebM, MOV. Audio is extracted locally in your browser.</p>
                  <button type="button" onClick={() => fileRef.current?.click()} className="min-h-[46px] inline-flex items-center gap-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 px-5 text-sm font-medium text-zinc-100">
                    <Icon name="FolderOpen" className="w-4 h-4 text-amber-400" /><span>Open File Picker</span>
                  </button>
                </div>
              )}
            </div>

            {(huge || warn) && (
              <div className="flex items-start gap-3 rounded-xl border border-amber-500/40 bg-amber-500/10 p-4 text-xs text-amber-200">
                <Icon name="AlertTriangle" className="w-5 h-5 text-amber-400 shrink-0" />
                <div>
                  <p className="font-semibold text-amber-100">{huge ? 'Large file warning (over 2 GB)' : 'High memory notice (over 1.2 GB)'}</p>
                  <p className="mt-1">Your browser or tablet may run out of memory decoding large files. Try shorter videos under 1.5 GB.</p>
                </div>
              </div>
            )}

            <div className="rounded-2xl border border-zinc-800/90 bg-[#111114] p-5 space-y-3">
              <label className="block text-sm font-medium text-zinc-200">Or paste a direct video URL (.mp4 / .webm)</label>
              <div className="relative">
                <Icon name="Link2" className="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2" />
                <input type="url" value={url} onChange={(e) => { setUrl(e.target.value); if (e.target.value.trim()) setFile(null); setErr(null); }} placeholder="https://example.com/my-stream-vod.mp4" className="w-full min-h-[46px] rounded-xl border border-zinc-800 bg-zinc-950 pl-10 pr-4 text-sm text-zinc-100 placeholder:text-zinc-600 focus:border-amber-500 focus:outline-none" />
              </div>
              {restricted && (
                <div className="rounded-xl border border-amber-500/40 bg-amber-500/10 p-4 space-y-3">
                  <p className="text-xs sm:text-sm text-amber-100">Browsers can't download from these sites. Download the video first, then upload it here.</p>
                  <button type="button" onClick={() => fileRef.current?.click()} className="min-h-[44px] inline-flex items-center gap-2 rounded-xl bg-amber-500 px-4 text-xs font-semibold text-zinc-950 hover:bg-amber-400">
                    <Icon name="FolderOpen" className="w-4 h-4" /><span>Open File Picker</span>
                  </button>
                </div>
              )}
            </div>

            <div className="rounded-2xl border border-zinc-800/90 bg-[#111114] p-5 space-y-5">
              <div>
                <label className="block text-sm font-medium text-zinc-200 mb-1.5">Job title</label>
                <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Podcast Episode 42" className="w-full min-h-[44px] rounded-xl border border-zinc-800 bg-zinc-950 px-3.5 text-sm text-zinc-100 focus:border-amber-500 focus:outline-none" />
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-medium text-zinc-400 mb-1.5">Clips to generate</label>
                  <select value={cfg.clipCount} onChange={(e) => setCfg({ ...cfg, clipCount: Number(e.target.value) })} className="w-full min-h-[44px] rounded-xl border border-zinc-800 bg-zinc-950 px-3 text-sm text-zinc-100">
                    {[1, 2, 3, 4, 5, 6, 8, 10].map((n) => <option key={n} value={n}>{n} clip{n > 1 ? 's' : ''}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-medium text-zinc-400 mb-1.5">Min length (sec)</label>
                  <input type="number" min={10} max={45} value={cfg.minDurationSec} onChange={(e) => setCfg({ ...cfg, minDurationSec: Math.max(10, Math.min(45, Number(e.target.value))) })} className="w-full min-h-[44px] rounded-xl border border-zinc-800 bg-zinc-950 px-3 text-sm font-mono-tabular text-zinc-100" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-zinc-400 mb-1.5">Max length (sec)</label>
                  <input type="number" min={15} max={90} value={cfg.maxDurationSec} onChange={(e) => setCfg({ ...cfg, maxDurationSec: Math.max(cfg.minDurationSec + 5, Math.min(90, Number(e.target.value))) })} className="w-full min-h-[44px] rounded-xl border border-zinc-800 bg-zinc-950 px-3 text-sm font-mono-tabular text-zinc-100" />
                </div>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-medium text-zinc-400 mb-1.5">9:16 Framing</label>
                  <select value={cfg.cropMode} onChange={(e) => setCfg({ ...cfg, cropMode: e.target.value })} className="w-full min-h-[44px] rounded-xl border border-zinc-800 bg-zinc-950 px-3 text-sm text-zinc-100">
                    <option value="center-crop">Center Crop (Fill 9:16)</option>
                    <option value="blurred-fit">Blurred Background Fit</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-medium text-zinc-400 mb-1.5">Spoken Language</label>
                  <select value={cfg.language} onChange={(e) => setCfg({ ...cfg, language: e.target.value })} className="w-full min-h-[44px] rounded-xl border border-zinc-800 bg-zinc-950 px-3 text-sm text-zinc-100">
                    {[['auto', 'Auto-detect'], ['en', 'English'], ['es', 'Spanish'], ['fr', 'French'], ['de', 'German'], ['pt', 'Portuguese'], ['ja', 'Japanese'], ['hi', 'Hindi']].map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                  </select>
                </div>
                <div className="flex items-end">
                  <label className="w-full min-h-[44px] flex items-center justify-between rounded-xl border border-zinc-800 bg-zinc-950 px-3.5 cursor-pointer">
                    <span className="text-sm text-zinc-200">On-screen hook</span>
                    <input type="checkbox" checked={cfg.hookEnabled} onChange={(e) => setCfg({ ...cfg, hookEnabled: e.target.checked })} className="h-5 w-5 accent-amber-500" />
                  </label>
                </div>
              </div>
              <div>
                <span className="block text-xs font-medium text-zinc-400 mb-2">Caption style (live preview)</span>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  {['bold-pop', 'heavy', 'clean'].map((id) => (
                    <button key={id} type="button" onClick={() => setCfg({ ...cfg, captionStyle: id })} className={`text-left rounded-xl border p-3 ${cfg.captionStyle === id ? 'border-amber-500 bg-amber-500/10' : 'border-zinc-800 bg-zinc-950 hover:border-zinc-700'}`}>
                      <CaptionStylePreview styleId={id} compact />
                      <div className="mt-2.5 flex items-center justify-between"><span className="text-sm font-semibold text-zinc-100">{CAPTION_META[id].name}</span>{cfg.captionStyle === id && <span className="text-[11px] text-amber-400">Selected</span>}</div>
                      <p className="mt-0.5 text-[11px] text-zinc-400">{CAPTION_META[id].description}</p>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {err && <div className="rounded-xl border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200">{err}</div>}
            <div className="flex justify-end">
              <button type="submit" disabled={busy || Boolean(restricted)} className="w-full sm:w-auto min-h-[48px] inline-flex items-center justify-center gap-2 rounded-xl bg-amber-500 px-6 text-sm font-semibold text-zinc-950 hover:bg-amber-400 disabled:opacity-50">
                <Icon name="Play" className="w-4 h-4 fill-current" /><span>{busy ? 'Adding to queue...' : 'Queue & Process Video'}</span>
              </button>
            </div>
          </form>
        );
      }

      // --- Clip Editor Modal ---
      function ClipEditorModal({ clip, onClose, onSaveClip, onQueueClip }) {
        const [title, setTitle] = useState(clip.title);
        const [hook, setHook] = useState(clip.hook);
        const [hookEnabled, setHookEnabled] = useState(clip.hookEnabled);
        const [startSec, setStartSec] = useState(clip.startSec);
        const [endSec, setEndSec] = useState(clip.endSec);
        const [captionStyle, setCaptionStyle] = useState(clip.captionStyle);
        const [cropMode, setCropMode] = useState(clip.cropMode);
        const [captionText, setCaptionText] = useState((clip.words || []).map((w) => w.word).join(' '));
        const [videoUrl, setVideoUrl] = useState(null);
        const [sourceBlob, setSourceBlob] = useState(null);
        const [playing, setPlaying] = useState(false);
        const [curTime, setCurTime] = useState(clip.startSec);
        const [rendering, setRendering] = useState(false);
        const [pct, setPct] = useState(0);
        const [status, setStatus] = useState('');
        const [rErr, setRErr] = useState(null);
        const [rKey, setRKey] = useState(clip.renderedBlobKey);
        const [rMime, setRMime] = useState(clip.renderedMimeType);
        const [saving, setSaving] = useState(false);

        const videoRef = useRef(null), canvasRef = useRef(null), abortRef = useRef(null);
        const buildWords = useCallback(() => {
          const toks = captionText.trim().split(/\s+/).filter(Boolean);
          if (!toks.length) return [];
          const orig = clip.words || [];
          if (orig.length === toks.length && orig.every((w, i) => w.word === toks[i])) return orig;
          const step = Math.max(1, endSec - startSec) / toks.length;
          return toks.map((word, i) => ({ word, start: Number((startSec + i * step).toFixed(2)), end: Number((startSec + (i + 1) * step).toFixed(2)) }));
        }, [captionText, clip.words, startSec, endSec]);

        const stRef = useRef({});
        stRef.current = { startSec, endSec, cropMode, hook, hookEnabled, captionStyle, playing, curTime, words: buildWords() };

        useEffect(() => {
          let u = null;
          storage.getBlob(clip.sourceVideoBlobKey).then((b) => { if (b) { setSourceBlob(b); u = URL.createObjectURL(b); setVideoUrl(u); } });
          return () => { if (u) URL.revokeObjectURL(u); abortRef.current?.abort(); };
        }, [clip.sourceVideoBlobKey]);

        useEffect(() => {
          let raf = 0, alive = true;
          ensureFontsLoaded().then(() => {
            const tick = () => {
              if (!alive) return;
              const v = videoRef.current, c = canvasRef.current, st = stRef.current;
              if (c) {
                const ctx = c.getContext('2d'), t = v ? v.currentTime : st.curTime;
                if (v && st.playing) { setCurTime(t); if (t >= st.endSec) v.currentTime = st.startSec; }
                if (ctx) drawClipFrame({ ctx, width: c.width, height: c.height, video: v, currentTimeSec: t, clipStartSec: st.startSec, clipEndSec: st.endSec, cropMode: st.cropMode, hook: st.hook, hookEnabled: st.hookEnabled, captionStyle: st.captionStyle, words: st.words });
              }
              raf = requestAnimationFrame(tick);
            };
            raf = requestAnimationFrame(tick);
          });
          return () => { alive = false; cancelAnimationFrame(raf); };
        }, []);

        const seek = (s) => { const c = Math.max(startSec, Math.min(endSec, s)); setCurTime(c); if (videoRef.current) videoRef.current.currentTime = c; };
        const togglePlay = () => {
          const v = videoRef.current; if (!v) return;
          if (playing) { v.pause(); setPlaying(false); } else { if (v.currentTime < startSec || v.currentTime >= endSec) v.currentTime = startSec; v.play().then(() => setPlaying(true)).catch(() => {}); }
        };
        const handleSave = async () => {
          setSaving(true);
          try { const words = buildWords(); await onSaveClip({ ...clip, title: title.trim() || clip.title, hook: hook.trim(), hookEnabled, startSec, endSec, captionStyle, cropMode, words, hasCaptions: words.length > 0, renderedBlobKey: rKey, renderedMimeType: rMime, updatedAt: Date.now() }); onClose(); } finally { setSaving(false); }
        };
        const handleRender = async () => {
          if (!sourceBlob) return setRErr('Source video blob is unavailable.');
          if (videoRef.current && playing) { videoRef.current.pause(); setPlaying(false); }
          setRErr(null); setRendering(true); setPct(2); setStatus('Starting 1080×1920 render...');
          const ctrl = new AbortController(); abortRef.current = ctrl;
          try {
            const words = buildWords();
            const out = await renderClipToVideoBlob({ videoBlob: sourceBlob, startSec, endSec, hook, hookEnabled, captionStyle, cropMode, words, signal: ctrl.signal, onProgress: (p, m) => { setPct(p); setStatus(m); } });
            const key = rKey || uid('render'); await storage.saveBlob(key, out.blob); setRKey(key); setRMime(out.mimeType);
            await onSaveClip({ ...clip, title: title.trim() || clip.title, hook: hook.trim(), hookEnabled, startSec, endSec, captionStyle, cropMode, words, hasCaptions: words.length > 0, renderedBlobKey: key, renderedMimeType: out.mimeType, updatedAt: Date.now() });
            setStatus('Rendered & saved locally!');
          } catch (ex) { setRErr(ex?.message || 'Render failed'); } finally { setRendering(false); abortRef.current = null; }
        };
        const downloadRendered = async () => {
          if (!rKey) return; const b = await storage.getBlob(rKey); if (!b) return;
          const u = URL.createObjectURL(b), a = document.createElement('a');
          a.href = u; a.download = `${(title || 'peakcut-clip').replace(/[^a-z0-9-_]+/gi, '_').toLowerCase()}.${rMime?.includes('mp4') ? 'mp4' : 'webm'}`; a.click();
          setTimeout(() => URL.revokeObjectURL(u), 5000);
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-2 sm:p-4 overflow-y-auto">
            <div className="w-full max-w-5xl rounded-2xl border border-zinc-800 bg-[#111114] shadow-2xl overflow-hidden my-auto max-h-[95vh] flex flex-col">
              <div className="flex items-center justify-between px-5 py-4 border-b border-zinc-800">
                <div><h2 className="text-lg font-semibold text-zinc-100">Edit & Render Clip</h2><p className="text-xs text-zinc-400 font-mono-tabular">{formatTime(startSec)} – {formatTime(endSec)} ({(endSec - startSec).toFixed(1)}s) · 1080×1920 9:16</p></div>
                <button type="button" onClick={onClose} className="min-h-[44px] min-w-[44px] flex items-center justify-center rounded-xl text-zinc-400 hover:bg-zinc-800"><Icon name="X" className="w-5 h-5" /></button>
              </div>
              <div className="overflow-y-auto p-5 grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-5 flex flex-col items-center">
                  <div className="relative w-full max-w-[270px] aspect-[9/16] rounded-2xl overflow-hidden border border-zinc-800 bg-black">
                    <canvas ref={canvasRef} width={540} height={960} className="w-full h-full object-contain" />
                    {videoUrl && <video ref={videoRef} src={videoUrl} playsInline preload="auto" className="hidden" onLoadedMetadata={() => seek(startSec)} />}
                    <button type="button" onClick={togglePlay} className="absolute bottom-4 left-1/2 -translate-x-1/2 min-h-[44px] inline-flex items-center gap-2 rounded-full bg-zinc-950/85 border border-zinc-700 px-4 text-xs font-semibold text-zinc-100">
                      <Icon name={playing ? 'Pause' : 'Play'} className={`w-4 h-4 text-amber-400 ${!playing ? 'fill-current' : ''}`} /><span>{playing ? 'Pause' : 'Play Preview'}</span>
                    </button>
                  </div>
                  <div className="w-full max-w-[270px] mt-3">
                    <input type="range" className="w-full studio-slider" min={startSec} max={Math.max(startSec + 1, endSec)} step={0.1} value={Math.min(endSec, Math.max(startSec, curTime))} onChange={(e) => seek(Number(e.target.value))} />
                    <div className="flex justify-between text-[11px] font-mono-tabular text-zinc-500 mt-1"><span>{formatTime(curTime - startSec)}</span><span>{formatTime(endSec - startSec)}</span></div>
                  </div>
                </div>
                <div className="lg:col-span-7 space-y-5">
                  <div className="rounded-xl border border-zinc-800 bg-zinc-950/70 p-4 space-y-3">
                    <div className="flex justify-between text-xs"><span className="font-medium text-zinc-300">Trim Start & End</span><span className="font-mono-tabular text-amber-400">Duration: {(endSec - startSec).toFixed(1)}s</span></div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div><div className="flex justify-between text-xs text-zinc-400 mb-1"><span>Start</span><span className="font-mono-tabular">{formatTime(startSec)}</span></div><input type="range" className="w-full studio-slider" min={0} max={Math.max(0, endSec - 5)} step={0.5} value={startSec} onChange={(e) => { const v = Number(e.target.value); setStartSec(v); seek(v); }} /></div>
                      <div><div className="flex justify-between text-xs text-zinc-400 mb-1"><span>End</span><span className="font-mono-tabular">{formatTime(endSec)}</span></div><input type="range" className="w-full studio-slider" min={startSec + 5} max={Math.max(startSec + 5, clip.sourceDurationSec || clip.endSec + 30)} step={0.5} value={endSec} onChange={(e) => setEndSec(Number(e.target.value))} /></div>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label className="block text-xs font-medium text-zinc-400 mb-1.5">Clip Title</label><input type="text" value={title} onChange={(e) => setTitle(e.target.value)} className="w-full min-h-[44px] rounded-xl border border-zinc-800 bg-zinc-950 px-3 text-sm text-zinc-100" /></div>
                    <div>
                      <div className="flex items-center justify-between mb-1.5"><label className="text-xs font-medium text-zinc-400">Hook Overlay (2s)</label><label className="inline-flex items-center gap-1.5 text-xs text-zinc-300 cursor-pointer"><input type="checkbox" checked={hookEnabled} onChange={(e) => setHookEnabled(e.target.checked)} className="accent-amber-500" /><span>Show</span></label></div>
                      <input type="text" value={hook} onChange={(e) => setHook(e.target.value)} disabled={!hookEnabled} className="w-full min-h-[44px] rounded-xl border border-zinc-800 bg-zinc-950 px-3 text-sm text-zinc-100 disabled:opacity-40" />
                    </div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label className="block text-xs font-medium text-zinc-400 mb-1.5">Caption Style</label><div className="grid grid-cols-3 gap-2">{['bold-pop', 'heavy', 'clean'].map((id) => <button key={id} type="button" onClick={() => setCaptionStyle(id)} className={`min-h-[44px] rounded-xl border px-2 text-xs font-medium ${captionStyle === id ? 'border-amber-500 bg-amber-500/15 text-amber-300' : 'border-zinc-800 bg-zinc-950 text-zinc-300'}`}>{CAPTION_META[id].name}</button>)}</div></div>
                    <div><label className="block text-xs font-medium text-zinc-400 mb-1.5">9:16 Framing</label><div className="grid grid-cols-2 gap-2">{['center-crop', 'blurred-fit'].map((m) => <button key={m} type="button" onClick={() => setCropMode(m)} className={`min-h-[44px] rounded-xl border px-2 text-xs font-medium ${cropMode === m ? 'border-amber-500 bg-amber-500/15 text-amber-300' : 'border-zinc-800 bg-zinc-950 text-zinc-300'}`}>{m === 'center-crop' ? 'Center Crop' : 'Blurred Fit'}</button>)}</div></div>
                  </div>
                  <div><label className="block text-xs font-medium text-zinc-400 mb-1.5">Captions Transcript (word-by-word synced)</label><textarea rows={3} value={captionText} onChange={(e) => setCaptionText(e.target.value)} placeholder="Add an AI key in Settings > AI or type captions here" className="w-full rounded-xl border border-zinc-800 bg-zinc-950 p-3 text-sm text-zinc-100" /></div>
                  {rendering && (
                    <div className="rounded-xl border border-amber-500/30 bg-amber-500/10 p-3.5 space-y-2">
                      <div className="flex justify-between text-xs text-amber-200"><span className="inline-flex items-center gap-2"><Icon name="Loader2" className="w-3.5 h-3.5 animate-spin" />{status}</span><span className="font-mono-tabular">{pct}%</span></div>
                      <div className="h-1.5 w-full rounded-full bg-zinc-900 overflow-hidden"><div className="h-full bg-amber-500" style={{ width: `${pct}%` }} /></div>
                      <button type="button" onClick={() => abortRef.current?.abort()} className="text-xs text-rose-300 hover:underline">Cancel render</button>
                    </div>
                  )}
                  {rErr && <div className="rounded-xl border border-rose-500/40 bg-rose-500/10 p-3 text-xs text-rose-200">{rErr}</div>}
                  {rKey && !rendering && (
                    <div className="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-xs text-emerald-200">
                      <span className="inline-flex items-center gap-2"><Icon name="CheckCircle2" className="w-4 h-4 text-emerald-400" />1080×1920 vertical video ready.</span>
                      <button type="button" onClick={downloadRendered} className="min-h-[36px] inline-flex items-center gap-1.5 rounded-lg bg-emerald-500 px-3 font-semibold text-zinc-950"><Icon name="Download" className="w-3.5 h-3.5" /><span>Download</span></button>
                    </div>
                  )}
                </div>
              </div>
              <div className="flex flex-wrap items-center justify-between gap-3 px-5 py-4 border-t border-zinc-800 bg-zinc-950/60">
                <div className="flex gap-2">
                  <button type="button" onClick={() => onQueueClip(clip, 'youtube-shorts')} className="min-h-[44px] inline-flex items-center gap-1.5 rounded-xl border border-zinc-700 bg-zinc-900 px-3.5 text-xs font-medium text-zinc-200"><Icon name="CalendarPlus" className="w-4 h-4 text-rose-400" /><span>Queue Shorts</span></button>
                  <button type="button" onClick={() => onQueueClip(clip, 'instagram-reels')} className="min-h-[44px] inline-flex items-center gap-1.5 rounded-xl border border-zinc-700 bg-zinc-900 px-3.5 text-xs font-medium text-zinc-200"><Icon name="CalendarPlus" className="w-4 h-4 text-amber-400" /><span>Queue Reels</span></button>

                </button>
                {wsDrop && (
                  <div className="absolute left-4 right-4 top-full mt-1.5 z-40 rounded-xl border border-zinc-700 bg-zinc-900 p-1.5 shadow-2xl space-y-1">
                    {workspaces.map((w) => <button key={w.id} type="button" onClick={() => switchWs(w.id)} className={`w-full flex items-center gap-2.5 rounded-lg px-2.5 py-2 text-left text-xs font-medium ${w.id === activeWs.id ? 'bg-amber-500/15 text-amber-300' : 'text-zinc-200 hover:bg-zinc-800'}`}><span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: w.avatarColor }} /><span className="truncate">{w.name}</span></button>)}
                    <button type="button" onClick={() => { setWsDrop(false); setTab('settings'); }} className="w-full text-left rounded-lg px-2.5 py-2 text-xs text-zinc-400 hover:text-zinc-100 border-t border-zinc-800 mt-1">Manage workspaces...</button>
                  </div>
                )}
              </div>
              <nav className="flex-1 p-3 space-y-1 overflow-y-auto">
                {sidebar.map(([id, lbl, ic]) => (
                  <button key={id} type="button" onClick={() => { if (id !== 'clips') setJobFilter(null); setTab(id); }} className={`w-full min-h-[44px] flex items-center gap-3 rounded-xl px-3.5 text-sm font-medium whitespace-nowrap ${tab === id ? 'bg-amber-500/15 text-amber-300' : 'text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/70'}`}>
                    <Icon name={ic} className={`w-4 h-4 shrink-0 ${tab === id ? 'text-amber-400' : ''}`} /><span>{lbl}</span>
                  </button>
                ))}
              </nav>
              <div className="p-4 border-t border-zinc-800/80 flex items-start gap-2 text-[11px] text-zinc-500"><Icon name="ShieldAlert" className="w-3.5 h-3.5 shrink-0 mt-0.5" /><span>Only clip videos you made or have permission to use.</span></div>
            </aside>

            <header className="md:hidden sticky top-0 z-30 h-14 border-b border-zinc-800/80 bg-[#09090b]/95 backdrop-blur-md px-4 flex items-center justify-between gap-3">
              <div className="flex items-center gap-2"><div className="w-7 h-7 rounded-lg bg-amber-500 flex items-center justify-center text-zinc-950"><Icon name="Scissors" className="w-4 h-4" /></div><span className="font-display text-base font-bold text-zinc-50">PeakCut</span></div>
              <select value={activeWs.id} onChange={(e) => switchWs(e.target.value)} className="min-h-[38px] max-w-[190px] rounded-lg border border-zinc-800 bg-zinc-900 px-2.5 text-xs font-medium text-zinc-100 truncate">
                {workspaces.map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
              </select>
            </header>

            <main className="flex-1 md:pl-64 lg:pl-72 pb-24 md:pb-10">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                {tab === 'dashboard' && <DashboardView workspace={activeWs} jobs={jobs} clips={clips} posts={posts} aiUsage={aiUsage} onNavigate={setTab} onOpenJobClips={(id) => { setJobFilter(id); setTab('clips'); }} onCancelJob={(id) => { cancelJobExecution(id); const t = jobs.find((j) => j.id === id); if (t?.stage === 'queued') { const u = { ...t, stage: 'cancelled', stageDetail: 'Cancelled', updatedAt: Date.now() }; storage.saveJob(u); setJobs((p) => p.map((j) => (j.id === id ? u : j))); } }} onRetryJob={async (job) => { const u = { ...job, stage: 'queued', progress: 0, stageDetail: 'Queued for retry', error: undefined, updatedAt: Date.now() }; await storage.saveJob(u); setJobs((p) => p.map((j) => (j.id === job.id ? u : j))); }} onDeleteJob={async (id) => { const j = jobs.find((x) => x.id === id); if (j?.videoBlobKey) await storage.deleteBlob(j.videoBlobKey).catch(() => {}); await storage.deleteJob(id); setJobs((p) => p.filter((x) => x.id !== id)); }} />}
                {tab === 'new-job' && <NewJobView workspace={activeWs} aiSettings={aiSettings} onCreateFileJob={async ({ file, title, settings }) => { const k = uid('vid'); await storage.saveBlob(k, file); const nj = { id: uid('job'), workspaceId: activeWs.id, title, sourceType: 'file', sourceName: file.name, videoBlobKey: k, durationSec: 0, fileSizeBytes: file.size, stage: 'queued', progress: 0, stageDetail: 'Queued for processing', usedFallbackMode: false, transcriptText: '', words: [], settings, clipIds: [], createdAt: Date.now(), updatedAt: Date.now() }; await storage.saveJob(nj); setJobs((p) => [nj, ...p]); setTab('dashboard'); }} onCreateUrlJob={async ({ url, title, settings }) => { const nj = { id: uid('job'), workspaceId: activeWs.id, title, sourceType: 'url', sourceName: url, sourceUrl: url, durationSec: 0, fileSizeBytes: 0, stage: 'queued', progress: 0, stageDetail: 'Queued for download', usedFallbackMode: false, transcriptText: '', words: [], settings, clipIds: [], createdAt: Date.now(), updatedAt: Date.now() }; await storage.saveJob(nj); setJobs((p) => [nj, ...p]); setTab('dashboard'); }} />}
                {tab === 'clips' && <ClipsGridView workspace={activeWs} clips={clips} jobs={jobs} selectedJobFilter={jobFilter} onClearJobFilter={() => setJobFilter(null)} onUpdateClip={async (c) => { await storage.saveClip(c); setClips((p) => p.map((x) => (x.id === c.id ? c : x))); }} onDeleteClip={async (id) => { await storage.deleteClip(id); setClips((p) => p.filter((x) => x.id !== id)); }} onQueueClip={async (clip, platform) => { const post = { id: uid('post'), workspaceId: activeWs.id, clipId: clip.id, clipTitle: clip.title, platform, title: clip.title, description: clip.hook || clip.scoreReason, hashtags: [platform === 'youtube-shorts' ? '#Shorts' : '#Reels', '#PeakCut', '#Highlights'], status: 'queued', createdAt: Date.now() }; await storage.savePost(post); setPosts((p) => [post, ...p]); await storage.appendActivity(activeWs.id, { type: 'clip_queued', message: `Queued "${clip.title}" for ${platform === 'youtube-shorts' ? 'Shorts' : 'Reels'}` }); refreshWsUsage(); }} onNavigate={setTab} />}
                {tab === 'live' && <LiveClipView workspace={activeWs} aiSettings={aiSettings} onClipsCreated={(nc) => setClips((p) => [...nc, ...p])} onActivityLogged={refreshWsUsage} onNavigate={setTab} />}
                {tab === 'posting' && <PostingView workspace={activeWs} posts={posts} clips={clips} aiSettings={aiSettings} onUpdateWorkspace={async (w) => { await storage.saveWorkspace(w); setWorkspaces((p) => p.map((x) => (x.id === w.id ? w : x))); }} onUpdatePost={async (post) => { await storage.savePost(post); setPosts((p) => p.map((x) => (x.id === post.id ? post : x))); }} onDeletePost={async (id) => { await storage.deletePost(id); setPosts((p) => p.filter((x) => x.id !== id)); }} onUpdateClip={async (c) => { await storage.saveClip(c); setClips((p) => p.map((x) => (x.id === c.id ? c : x))); }} onActivityLogged={refreshWsUsage} />}
                {tab === 'usage' && <AIUsageView workspace={activeWs} aiUsage={aiUsage} />}
                {tab === 'settings' && <SettingsView workspace={activeWs} workspaces={workspaces} aiSettings={aiSettings} onUpdateAISettings={setAiSettings} onUpdateWorkspace={async (w) => { await storage.saveWorkspace(w); setWorkspaces((p) => p.map((x) => (x.id === w.id ? w : x))); }} onCreateWorkspace={async (w) => { await storage.saveWorkspace(w); setWorkspaces((p) => [...p, w]); switchWs(w.id); }} onDeleteWorkspace={async (id) => { if (workspaces.length <= 1) return; await storage.deleteWorkspace(id); const rem = workspaces.filter((w) => w.id !== id); setWorkspaces(rem); if (activeWsId === id && rem[0]) switchWs(rem[0].id); }} onReloadAllData={reloadAll} />}
              </div>
            </main>

            <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#0d0d10]/95 backdrop-blur-md border-t border-zinc-800/90 pb-safe">
              <div className="grid grid-cols-5 h-16 items-center">
                {mobileNav.map(([id, lbl, ic]) => (
                  <button key={id} type="button" onClick={() => { if (id !== 'clips') setJobFilter(null); setTab(id); }} className={`min-h-[48px] flex flex-col items-center justify-center gap-1 ${tab === id ? 'text-amber-400' : 'text-zinc-500'}`}>
                    <Icon name={ic} className="w-5 h-5" /><span className="text-[10px] font-medium whitespace-nowrap">{lbl}</span>
                  </button>
                ))}
              </div>
            </nav>

            {!isOnline && (
              <div className="fixed bottom-20 md:bottom-4 left-4 z-50 flex items-center gap-2 rounded-xl border border-amber-500/40 bg-zinc-900/95 px-3.5 py-2 text-xs text-amber-300 shadow-lg backdrop-blur-md">
                <Icon name="WifiOff" className="w-4 h-4 shrink-0" /><span>Offline mode — local videos & studio data remain available.</span>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
