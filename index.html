          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- Live Clipping Tab ----------
function LiveClipTab({ settings, aiConfig, activeKey, hasAiKey, activeWsId, logAiUsage, onClipSaved }) {
  const [liveActive, setLiveActive] = useState(false);
  const [sourceType, setSourceType] = useState('screen');
  const [moments, setMoments] = useState([]);
  const [level, setLevel] = useState(0);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const recRef = useRef(null);
  const chunksRef = useRef([]); // { ts, blob }
  const startMsRef = useRef(0);
  const timerRef = useRef(null);

  const stopLive = () => {
    clearInterval(timerRef.current);
    if (recRef.current && recRef.current.state !== 'inactive') recRef.current.stop();
    if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    streamRef.current = null;
    setLiveActive(false);
  };

  useEffect(() => () => stopLive(), []);

  async function startLive() {
    try {
      const stream = sourceType === 'screen'
        ? await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
        : await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
      streamRef.current = stream;
      if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play().catch(() => {}); }
      chunksRef.current = [];
      startMsRef.current = Date.now();

      const mime = ['video/webm;codecs=vp8,opus', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m)) || '';
      const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      recRef.current = rec;
      const keepMs = Math.max(1, settings.liveBufferMinutes) * 60_000;
      rec.ondataavailable = (e) => {
        if (e.data.size > 0) {
          const now = Date.now();
          chunksRef.current.push({ ts: now, blob: e.data });
          // Trim rolling buffer beyond configured N minutes (keep chunk 0 as init header if needed)
          while (chunksRef.current.length > 2 && now - chunksRef.current[1].ts > keepMs) {
            chunksRef.current.splice(1, 1);
          }
        }
      };
      rec.start(1000);
      setLiveActive(true);

      // Loudness spike analyser
      if (stream.getAudioTracks().length) {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const src = ac.createMediaStreamSource(stream);
        const an = ac.createAnalyser();
        an.fftSize = 512;
        src.connect(an);
        const buf = new Uint8Array(an.frequencyBinCount);
        let lastMomentMs = 0;
        timerRef.current = setInterval(() => {
          an.getByteTimeDomainData(buf);
          let sum = 0;
          for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
          const rms = Math.sqrt(sum / buf.length);
          setLevel(Math.min(100, Math.round(rms * 350)));
          if (rms > 0.22 && Date.now() - lastMomentMs > 12000) {
            lastMomentMs = Date.now();
            const sec = (lastMomentMs - startMsRef.current) / 1000;
            setMoments((prev) => [{ id: uid(), sec, label: `Audio spike at ${fmtTime(sec)}` }, ...prev]);
          }
        }, 250);
      }
    } catch (e) {
      alert(`Live capture failed: ${e.message}`);
    }
  }

  function cutBufferMoment(secBack = 30, title = 'Live Highlight') {
    if (!chunksRef.current.length) return;
    const fullBlob = new Blob(chunksRef.current.map((c) => c.blob), { type: chunksRef.current[0].blob.type || 'video/webm' });
    const estDur = chunksRef.current.length;
    const end = Math.max(5, estDur);
    const start = Math.max(0, end - secBack);
    const mediaKey = `live_${uid()}`;
    onClipSaved({
      id: uid(),
      projectId: 'live',
      workspaceId: activeWsId,
      mediaKey,
      start,
      end,
      title,
      hook: 'Live moment!',
      score: 8,
      reason: 'Cut from rolling live buffer',
      words: [],
      captionStyle: settings.defaultCaptionStyle,
      cropMode: settings.defaultCropMode,
      quality: settings.defaultQuality,
    }, fullBlob, mediaKey);
  }

  return (
    <div className="space-y-6">
      <div className="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 className="text-2xl md:text-3xl font-bold">Live Clipping</h1>
          <p className="text-sm text-zinc-400 mt-1">Rolling {settings.liveBufferMinutes}-minute buffer with live loudness spike detection.</p>
        </div>
        <div className="flex items-center gap-2">
          <select value={sourceType} onChange={(e) => setSourceType(e.target.value)} disabled={liveActive} className="bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm">
            <option value="screen">Screen / Tab + Audio</option>
            <option value="camera">Camera + Mic</option>
          </select>
          {!liveActive ? (
            <button onClick={startLive} className="px-5 py-2.5 rounded-xl bg-red-500 hover:bg-red-400 text-white font-semibold text-sm min-h-[44px]">Start Buffer</button>
          ) : (
            <button onClick={stopLive} className="px-5 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-sm font-semibold min-h-[44px]">Stop</button>
          )}
        </div>
      </div>

      <div className="grid lg:grid-cols-12 gap-6">
        <div className="lg:col-span-7 space-y-3">
          <video ref={videoRef} muted playsInline className="w-full aspect-video bg-zinc-900 rounded-2xl border border-zinc-800 object-contain" />
          <div className="flex items-center gap-4">
            <div className="flex-1 h-2.5 bg-zinc-900 rounded-full overflow-hidden border border-zinc-800">
              <div className="h-full bg-emerald-400 transition-all" style={{ width: `${level}%` }} />
            </div>
            <button
              disabled={!liveActive}
              onClick={() => cutBufferMoment(30, `Live Clip ${new Date().toLocaleTimeString()}`)}
              className="px-5 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-zinc-950 font-bold text-sm"
            >
              Clip Last 30 Seconds
            </button>
          </div>
        </div>

        <div className="lg:col-span-5 bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
          <h2 className="font-semibold">Moments Detected</h2>
          {moments.length === 0 ? (
            <p className="text-xs text-zinc-500 py-8 text-center">Start capturing to detect audio spikes & highlights.</p>
          ) : (
            <div className="space-y-2 max-h-80 overflow-y-auto">
              {moments.map((m) => (
                <button
                  key={m.id}
                  onClick={() => cutBufferMoment(30, m.label)}
                  className="w-full text-left p-3 rounded-xl bg-zinc-950 hover:border-amber-500 border border-zinc-800 flex items-center justify-between"
                >
                  <span className="text-xs font-medium">{m.label}</span>
                  <span className="text-xs text-amber-400 font-semibold">Cut 30s →</span>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------- Settings Tab (AI Providers, Quality Defaults, Workspaces, Backup/Data) ----------
function SettingsTab({ settings, setSettings, aiConfig, setAiConfig, workspaces, setWorkspaces, activeWsId, setActiveWsId, pushToast, onResetAll }) {
  const [sub, setSub] = useState('ai');
  const [testMsg, setTestMsg] = useState('');
  const [testing, setTesting] = useState(false);
  const [fetchedModels, setFetchedModels] = useState([]);
  const [wsName, setWsName] = useState('');
  const [wsHandle, setWsHandle] = useState('');

  const pCfg = PROVIDERS[aiConfig.provider] || PROVIDERS.gemini;
  const curKey = aiConfig.apiKeys[aiConfig.provider] || '';

  return (
    <div className="space-y-6 max-w-4xl">
      <div>
        <h1 className="text-2xl md:text-3xl font-bold">Settings</h1>
        <div className="flex flex-wrap gap-2 mt-4">
          {[{ id: 'ai', l: 'AI Providers' }, { id: 'defaults', l: 'Export & Clip Defaults' }, { id: 'workspaces', l: 'Workspaces' }, { id: 'data', l: 'Backup & Data' }].map((t) => (
            <button key={t.id} onClick={() => setSub(t.id)} className={`px-4 py-2 rounded-xl text-xs font-semibold ${sub === t.id ? 'bg-amber-500 text-zinc-950' : 'bg-zinc-900 border border-zinc-800 text-zinc-300'}`}>{t.l}</button>
          ))}
        </div>
      </div>

      {sub === 'ai' && (
        <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <label className="text-xs text-zinc-400">Active AI Provider</label>
              <select
                value={aiConfig.provider}
                onChange={(e) => { const p = e.target.value; setAiConfig((a) => ({ ...a, provider: p, model: PROVIDERS[p].defaultModel })); setFetchedModels([]); setTestMsg(''); }}
                className="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm"
              >
                {Object.values(PROVIDERS).map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs text-zinc-400">Model</label>
              <div className="flex gap-2 mt-1">
                <select
                  value={aiConfig.model}
                  onChange={(e) => setAiConfig((a) => ({ ...a, model: e.target.value }))}
                  className="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm"
                >
                  {[...new Set([aiConfig.model, ...pCfg.models, ...fetchedModels])].filter(Boolean).map((m) => <option key={m} value={m}>{m}</option>)}
                </select>
                <button
                  onClick={async () => {
                    try { const list = await fetchProviderModels(aiConfig.provider, curKey, aiConfig.customBaseUrl); setFetchedModels(list); pushToast(`Loaded ${list.length} models`, 'success'); }
                    catch (e) { pushToast(e.message, 'error'); }
                  }}
                  className="px-3 rounded-xl bg-zinc-800 text-xs font-semibold"
                >
                  Find models
                </button>
              </div>
            </div>
          </div>

          {aiConfig.provider === 'custom' && (
            <div>
              <label className="text-xs text-zinc-400">Custom Base URL</label>
              <input value={aiConfig.customBaseUrl} onChange={(e) => setAiConfig((a) => ({ ...a, customBaseUrl: e.target.value }))} placeholder="https://api.example.com/v1" className="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm" />
            </div>
          )}

          <div>
            <div className="flex justify-between text-xs text-zinc-400">
              <span>API Key (Stored locally in IndexedDB · Current: {maskKey(curKey)})</span>
              {pCfg.keyUrl && <a href={pCfg.keyUrl} target="_blank" rel="noreferrer" className="text-amber-400 hover:underline">Get key ↗</a>}
            </div>
            <input
              type="password"
              value={curKey}
              onChange={(e) => setAiConfig((a) => ({ ...a, apiKeys: { ...a.apiKeys, [a.provider]: e.target.value } }))}
              placeholder="Paste API key (leave empty for free loudness-peak mode)"
              className="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm font-mono"
            />
          </div>

          <div className="flex flex-wrap items-center gap-3">
            <button
              disabled={testing}
              onClick={async () => {
                setTesting(true); setTestMsg('');
                try {
                  const reply = await callProviderChat({
                    provider: aiConfig.provider, model: aiConfig.model, apiKey: curKey, customBaseUrl: aiConfig.customBaseUrl,
                    systemPrompt: 'Return JSON {"ok":true}', userPrompt: 'Ping',
                  });
                  setTestMsg(`Connected! Reply: ${reply.slice(0, 80)}`);
                } catch (e) {
                  setTestMsg(`Error: ${e.message}`);
                } finally { setTesting(false); }
              }}
              className="px-4 py-2.5 rounded-xl bg-amber-500 text-zinc-950 font-semibold text-sm"
            >
              {testing ? 'Testing...' : 'Save and Test Key'}
            </button>
            {testMsg && <span className="text-xs text-zinc-300">{testMsg}</span>}
          </div>
        </div>
      )}

      {sub === 'defaults' && (
        <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <label className="text-xs text-zinc-400">Default Export Quality</label>
              <select value={settings.defaultQuality} onChange={(e) => setSettings((s) => ({ ...s, defaultQuality: e.target.value }))} className="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm">
                {Object.values(QUALITY_PRESETS).map((q) => <option key={q.id} value={q.id}>{q.label}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs text-zinc-400">Default Caption Style</label>
              <select value={settings.defaultCaptionStyle} onChange={(e) => setSettings((s) => ({ ...s, defaultCaptionStyle: e.target.value }))} className="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm">
                {Object.values(CAPTION_STYLES).map((c) => <option key={c.id} value={c.id}>{c.name} — {c.desc}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs text-zinc-400">Clip Length Min / Max (sec)</label>
              <div className="flex gap-2 mt-1">
                <input type="number" value={settings.clipMinSec} onChange={(e) => setSettings((s) => ({ ...s, clipMinSec: Number(e.target.value) }))} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm" />
                <input type="number" value={settings.clipMaxSec} onChange={(e) => setSettings((s) => ({ ...s, clipMaxSec: Number(e.target.value) }))} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm" />
              </div>
            </div>
            <div>
              <label className="text-xs text-zinc-400">Live Buffer (minutes)</label>
              <input type="number" min={1} max={15} value={settings.liveBufferMinutes} onChange={(e) => setSettings((s) => ({ ...s, liveBufferMinutes: Number(e.target.value) }))} className="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm" />
            </div>
          </div>
        </div>
      )}

      {sub === 'workspaces' && (
        <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
          <div className="flex flex-col sm:flex-row gap-2">
            <input value={wsName} onChange={(e) => setWsName(e.target.value)} placeholder="Workspace name" className="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm" />
            <input value={wsHandle} onChange={(e) => setWsHandle(e.target.value)} placeholder="@handle" className="bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm" />
            <button
              onClick={() => {
                if (!wsName.trim()) return;
                const nw = { id: uid(), name: wsName.trim(), handle: wsHandle.trim() || '@channel', captionStyle: settings.defaultCaptionStyle };
                setWorkspaces((w) => [...w, nw]); setActiveWsId(nw.id); setWsName(''); setWsHandle('');
              }}
              className="px-4 py-2 rounded-xl bg-amber-500 text-zinc-950 font-semibold text-sm"
            >
              Add Workspace
            </button>
          </div>
          <div className="space-y-2">
            {workspaces.map((w) => (
              <div key={w.id} className="flex items-center justify-between p-3 rounded-xl bg-zinc-950 border border-zinc-800 text-sm">
                <span><strong>{w.name}</strong> <span className="text-zinc-500">{w.handle}</span></span>
                {workspaces.length > 1 && <button onClick={() => setWorkspaces((p) => p.filter((x) => x.id !== w.id))} className="text-xs text-red-400">Remove</button>}
              </div>
            ))}
          </div>
        </div>
      )}

      {sub === 'data' && (
        <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
          <div className="flex flex-wrap gap-3">
            <button
              onClick={async () => {
                const state = await idbGet(STORE_APP, 'state');
                const blob = new Blob([JSON.stringify(state || {}, null, 2)], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'peakcut-backup.json'; a.click();
              }}
              className="px-4 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-sm font-semibold"
            >
              Export JSON Backup
            </button>
            <label className="px-4 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-sm font-semibold cursor-pointer">
              Import JSON Backup
              <input
                type="file" accept=".json" className="hidden"
                onChange={async (e) => {
                  const f = e.target.files?.[0]; if (!f) return;
                  const data = JSON.parse(await f.text());
                  await idbSet(STORE_APP, 'state', data);
                  location.reload();
                }}
              />
            </label>
            <button onClick={onResetAll} className="px-4 py-2.5 rounded-xl bg-red-500/20 text-red-300 text-sm font-semibold">
              Clear All Browser Data
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
